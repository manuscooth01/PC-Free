services:
  windows:
    image: dockurr/windows
    container_name: windows
    environment:
      VERSION: "custom"
      USERNAME: ${WINDOWS_USERNAME}
      PASSWORD: ${WINDOWS_PASSWORD}
      RAM_SIZE: "14G"
      CPU_CORES: "4"
    cap_add:
      - NET_ADMIN
    ports:
      - "3389:3389/tcp"
      - "47984:47984/tcp"
      - "47989:47989/tcp"
      - "47990:47990/tcp"
      - "48010:48010/tcp"
      - "47998-48000:47998-48000/udp"
      - "48002:48002/udp"
      - "48010:48010/udp"
    volumes:
      - /tmp/docker-data/storage:/storage
      - windows-data:/mnt/windows-data
    devices:
      - "/dev/kvm:/dev/kvm"
      - "/dev/net/tun:/dev/net/tun"
    stop_grace_period: 2m
    restart: always
volumes:
  windows-data: